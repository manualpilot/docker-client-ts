name: on push
on:
  push:
    branches: '**'

permissions:
  contents: read

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test

      # the release workflow builds before it tags, so keep the build honest here too
      - name: build
        run: npm run build
