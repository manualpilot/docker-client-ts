name: run publish
description: build the package, publish it to npm and cut a github release for the current tag

inputs:
  github-token:
    description: token used to create the github release
    required: true
  node-auth-token:
    description: npm token used to publish the package
    required: true

runs:
  using: composite
  steps:
    # writes an .npmrc that reads the token from NODE_AUTH_TOKEN, so the token
    # itself never lands on disk
    - uses: ./.github/actions/setup
      with:
        registry-url: https://registry.npmjs.org/

    - name: build
      shell: bash
      run: npm run build

    - name: publish to npm
      shell: bash
      run: npm publish --tag latest --access public

    - name: github release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        zip -r dist.zip package.json tsconfig.json README.md LICENSE dist src
        version=$(jq -r .version package.json)

        gh release create "${version}" dist.zip \
          --verify-tag \
          --title "${version}" \
          --generate-notes \
          --repo "${REPO}"
